name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, component and SEO checks
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the guarded static site
        run: npm run build:pages
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_PAGES_PRODUCTION: ${{ vars.PRODUCTION_SITE == 'true' && '1' || '0' }}
          CANONICAL_DOMAIN: ${{ vars.CANONICAL_DOMAIN }}
      - name: Verify the exported site
        run: npm run test:pages
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_PAGES_PRODUCTION: ${{ vars.PRODUCTION_SITE == 'true' && '1' || '0' }}
          CANONICAL_DOMAIN: ${{ vars.CANONICAL_DOMAIN }}
      - name: Browser and mobile checks
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          TEST_BROWSER_CHANNEL: chrome
        run: |
          mkdir -p ".qa/site${PAGES_BASE_PATH}"
          cp -R pages-out/. ".qa/site${PAGES_BASE_PATH}/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .qa/site > .qa/server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent "http://127.0.0.1:4173${PAGES_BASE_PATH}/" > /dev/null && break
            sleep 1
          done
          TEST_ORIGIN="http://127.0.0.1:4173${PAGES_BASE_PATH}" npm run test:browser
          TEST_ORIGIN="http://127.0.0.1:4173${PAGES_BASE_PATH}" npm run test:contact
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
